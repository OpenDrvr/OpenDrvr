[package]
name = "opendrvr"
version = "0.1.0"
description = "Open-source Windows utility for hardware identification and official driver discovery"
authors = ["OpenDrvr contributors"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0"

[lib]
name = "opendrvr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
